<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiddX • UPI Payment</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#050505;color:#fff}
body{display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden}
#intro{position:fixed;inset:0;z-index:10;background:#050505;display:flex;align-items:center;justify-content:center;flex-direction:column;animation:introOut .8s 2.35s forwards}
.introLogo{font-size:64px;font-weight:900;font-style:italic;letter-spacing:-5px;animation:logoIn 1s cubic-bezier(.2,.8,.2,1)}
.introLogo span,.gold{color:#ffb21a}
.line{width:0;height:2px;background:#ffb21a;margin-top:10px;box-shadow:0 0 15px #ffb21a;animation:lineIn 1s .55s forwards}
.introText{opacity:0;color:#aaa;letter-spacing:5px;font-size:11px;margin-top:15px;animation:textIn .7s 1.05s forwards}
.loader{width:120px;height:2px;background:#222;margin-top:25px;overflow:hidden}
.loader i{display:block;height:100%;width:0;background:#ffb21a;animation:load 1.4s 1.05s forwards}
.card{width:min(430px,100%);padding:16px;border:1px solid #3a3a3a;border-radius:26px;background:rgba(10,10,10,.9);box-shadow:0 0 45px rgba(255,170,0,.14);text-align:center;opacity:0;transform:translateY(25px);animation:pageIn .9s 2.45s forwards}
.logo{font-size:46px;font-weight:900;font-style:italic;letter-spacing:-3px}
.sub{color:#bbb;letter-spacing:4px;font-size:12px;margin:3px 0 18px}
.qr-wrap{padding:12px;border-radius:22px;border:2px solid #ffb21a;box-shadow:0 0 25px rgba(255,178,26,.18);background:#050505;animation:pulse 2.5s 3.2s infinite}
.qr{width:100%;display:block;border-radius:14px}
.id{margin:16px 0 10px;padding:13px;border:1px solid #444;border-radius:14px;color:#eee;font-size:15px;background:#0d0d0d}
.note{color:#999;font-size:13px;margin:8px 0 18px}
button{border:0;border-radius:14px;padding:13px 20px;background:#ffb21a;color:#111;font-weight:800;font-size:15px}
.footer{margin-top:16px;color:#777;font-size:12px}
@keyframes logoIn{from{opacity:0;transform:scale(.65) translateY(20px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes lineIn{to{width:150px}}
@keyframes textIn{to{opacity:1}}
@keyframes load{to{width:100%}}
@keyframes introOut{to{opacity:0;visibility:hidden;transform:scale(1.05)}}
@keyframes pageIn{to{opacity:1;transform:none}}
@keyframes pulse{50%{box-shadow:0 0 38px rgba(255,178,26,.35)}}
</style>
</head>
<body>
<div id="intro">
  <div class="introLogo">Sidd<span>X</span></div>
  <div class="line"></div>
  <div class="introText">UPI PAYMENT</div>
  <div class="loader"><i></i></div>
</div>

<main class="card">
  <div class="logo">Sidd<span class="gold">X</span></div>
  <div class="sub">UPI PAYMENT</div>
  <div class="qr-wrap"><img class="qr" src="siddx-qr.png" alt="SiddX UPI QR Code"></div>
  <div class="id">siddxverma@fam</div>
  <div class="note">Scan the QR code to make a UPI payment</div>
  <button onclick="navigator.clipboard?.writeText('siddxverma@fam')">Copy UPI ID</button>
  <div class="footer">Small Payments • Big Support 🖤</div>
</main>
</body>
</html>
