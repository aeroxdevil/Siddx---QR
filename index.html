<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiddX • UPI Payment</title>
<meta name="description" content="SiddX UPI payment QR">
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
  padding:20px; font-family:Arial,sans-serif; color:#fff;
  background:radial-gradient(circle at top,#272018 0,#090909 42%,#000 100%);
}
.card{
  width:min(430px,100%); padding:16px; border:1px solid #3a3a3a;
  border-radius:26px; background:rgba(10,10,10,.88);
  box-shadow:0 0 45px rgba(255,170,0,.14); text-align:center;
}
.logo{font-size:46px;font-weight:900;font-style:italic;letter-spacing:-3px}
.gold{color:#ffb21a}
.sub{color:#bbb;letter-spacing:4px;font-size:12px;margin:3px 0 18px}
.qr-wrap{
  padding:12px; border-radius:22px; border:2px solid #ffb21a;
  box-shadow:0 0 25px rgba(255,178,26,.18); background:#050505;
}
.qr{width:100%;display:block;border-radius:14px}
.id{
  margin:16px 0 10px;padding:13px;border:1px solid #444;border-radius:14px;
  color:#eee;font-size:15px;background:#0d0d0d
}
.note{color:#999;font-size:13px;margin:8px 0 18px}
button{
  border:0;border-radius:14px;padding:13px 20px;background:#ffb21a;color:#111;
  font-weight:800;font-size:15px;cursor:pointer
}
.footer{margin-top:16px;color:#777;font-size:12px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">Sidd<span class="gold">X</span></div>
  <div class="sub">UPI PAYMENT</div>
  <div class="qr-wrap"><img class="qr" src="siddx-qr.png" alt="SiddX UPI QR Code"></div>
  <div class="id">siddxverma@fam</div>
  <div class="note">Scan the QR code to make a UPI payment</div>
  <button onclick="navigator.clipboard?.writeText('siddxverma@fam')">Copy UPI ID</button>
  <div class="footer">Small Payments • Big Support 🖤</div>
</main>
</body>
</html>
